<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CityViz NYC</title>
  <meta name="description" content="A 3D model of Manhattan painted with geo-registered photographs and live traffic cameras.">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.2.0/dist/spark.module.js"
    } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <img id="overlay" alt="">
  <div id="tooltip" hidden><img><div class="t"></div></div>

  <header id="panel">
    <h1>CityViz <span>NYC</span></h1>
    <p class="sub">Manhattan, painted by <b id="nphotos">…</b> geo-registered photos and <b id="ncams">…</b> live traffic cameras.</p>
    <label><input type="checkbox" id="tPhotos" checked> Photos</label>
    <label><input type="checkbox" id="tCams" checked> Live cams</label>
    <label><input type="checkbox" id="tLayers" checked> 3D layers</label>
    <label><input type="checkbox" id="tSplats" checked> Splats</label>
    <label><input type="checkbox" id="tMarkers" checked> Markers</label>
    <div id="status"></div>
    <p class="credit">Photos: Wikimedia Commons contributors · Mapillary contributors (CC BY-SA) · Cams: NYC DOT · 3D: NYC DoITT · Aerial: NYS ITS Geospatial Services</p>
  </header>

  <div id="photobar" hidden>
    <div class="meta">
      <a id="pTitle" target="_blank" rel="noopener"></a>
      <div id="pCredit"></div>
    </div>
    <label class="op">Photo <input type="range" id="pOpacity" min="0" max="1" step="0.01" value="0.85"></label>
    <button id="pPrev" title="Previous nearby (←)">‹</button>
    <button id="pNext" title="Next nearby (→)">›</button>
    <button id="pExit" title="Back to map (Esc)">✕</button>
  </div>

  <div id="strip"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
